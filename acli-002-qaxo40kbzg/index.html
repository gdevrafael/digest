<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agents CLI · Demo Screens</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: 16:9 recording stage. Step rail left, the typed terminal command on top (kept from V1),
   a bold Material-style stage of morphing shapes in the middle, one serif "learn" line at the bottom. */
:root{
  --bg:#eef1f6; --stage:#f8f9fc; --surface:#ffffff; --raised:#eef1f6; --line:#d6dde6;
  --fg:#191c20; --muted:#44474e; --faint:#5f6670;
  --b:#0b57d0; --bc:#d3e3fd; --onb:#ffffff; --onbc:#041e49;
  --g:#146c2e; --gc:#c4eed0; --ong:#ffffff;
  --y:#f9ab00; --yc:#ffefc2; --ony:#291800;
  --r:#b3261e; --rc:#f9dedc; --onr:#ffffff;
  --cmd-bg:#1d2433; --cmd-fg:#e8edf5; --cmd-dim:#9aa6b8;
  --display:"Newsreader",Georgia,serif;
  --body:"Roboto Flex","Google Sans",Roboto,-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f15; --stage:#11151d; --surface:#1a1f29; --raised:#222833; --line:#2f3744;
  --fg:#e3e6ec; --muted:#c3c7cf; --faint:#9aa1ab;
  --b:#a8c7fa; --bc:#0842a0; --onb:#062e6f; --onbc:#d3e3fd;
  --g:#6dd58c; --gc:#0f5223; --ong:#04210d;
  --y:#fdd663; --yc:#5c4300; --ony:#241a00;
  --r:#f2b8b5; --rc:#8c1d18; --onr:#410e0b;
  --cmd-bg:#070a0f; --cmd-fg:#e8edf5; --cmd-dim:#8d98aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f15; --stage:#11151d; --surface:#1a1f29; --raised:#222833; --line:#2f3744;
  --fg:#e3e6ec; --muted:#c3c7cf; --faint:#9aa1ab;
  --b:#a8c7fa; --bc:#0842a0; --onb:#062e6f; --onbc:#d3e3fd;
  --g:#6dd58c; --gc:#0f5223; --ong:#04210d;
  --y:#fdd663; --yc:#5c4300; --ony:#241a00;
  --r:#f2b8b5; --rc:#8c1d18; --onr:#410e0b;
  --cmd-bg:#070a0f; --cmd-fg:#e8edf5; --cmd-dim:#8d98aa; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:3px;border-radius:8px}

.frame{width:min(100%,1280px,calc((100dvh - 120px)*16/9));aspect-ratio:16/9;position:relative;flex:none}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--stage);
  border-radius:28px;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:262px 1fr}
body.clean .stage{border-radius:0;border:0}
body.clean .frame{width:min(100%,calc(100dvh*16/9))}

/* rail */
.rail{padding:30px 20px 30px 24px;display:flex;flex-direction:column;background:var(--raised)}
.brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.brand b{color:var(--fg);font-weight:700}
.steps{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:2px}
.steps::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--line)}
.thread{position:absolute;left:12px;top:14px;width:3px;border-radius:3px;background:var(--b);transition:height .7s var(--spring)}
.steps li{display:flex;align-items:center;gap:14px;padding:8px 10px 8px 0;font-size:15.5px;color:var(--faint);position:relative;border-radius:999px;cursor:pointer}
.dot{width:27px;height:27px;border-radius:50%;flex:none;background:var(--raised);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;z-index:1;transition:all .45s var(--spring)}
.steps li.done{color:var(--muted)}
.steps li.done .dot{border-color:var(--b);color:var(--b)}
.steps li.on{color:var(--onbc);background:var(--bc);font-weight:600}
.steps li.on .dot{background:var(--b);border-color:var(--b);color:var(--onb);border-radius:9px;transform:rotate(45deg) scale(1.08)}
.steps li.on .dot span{transform:rotate(-45deg)}
.phase{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:12px 0 2px 41px}

/* main */
.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.cmd{margin:28px 36px 0;background:var(--cmd-bg);color:var(--cmd-fg);border-radius:18px;padding:18px 26px;font-family:var(--mono);font-size:24px;line-height:1.45;min-height:72px;display:flex;gap:12px;align-items:flex-start}
.cmd .p{color:var(--cmd-dim);flex:none}
.cmd .t{overflow-wrap:anywhere}
.cmd .caret{display:inline-block;width:12px;height:1.1em;vertical-align:-3px;background:var(--cmd-fg);margin-left:2px;animation:blink 1s steps(1) infinite}
.cmd.noc .t{color:var(--cmd-dim);font-family:var(--body)}
@keyframes blink{50%{opacity:0}}
.view{position:relative;display:grid;place-items:center;padding:8px 36px;min-height:0;overflow:hidden}
.lesson{margin:0 36px 28px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:16px}
.lesson .k{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);flex:none}
.lesson .v{font-family:var(--display);font-style:italic;font-size:27px;line-height:1.25;text-wrap:balance}

/* motion primitives */
.pop{animation:pop .7s var(--spring) both;animation-delay:calc(var(--d,0)*1ms)}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.rise{animation:rise .7s var(--spring) both;animation-delay:calc(var(--d,0)*1ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.shape{display:block;overflow:visible}
.shape path{transition:d .8s var(--spring),fill .45s var(--ease)}
.spin{animation:spin 22s linear infinite}
.spin.fast{animation-duration:3.5s}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px)}}
.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
.lbl{font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.layer{position:relative;display:grid;place-items:center}
.layer>*{grid-area:1/1}
.layer>:not(:first-child){position:relative;z-index:1}
.glyph{width:42%;height:42%;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.glyph path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s var(--ease) forwards;animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}

/* 1 create */
.v-create{display:flex;align-items:center;gap:60px}
.hero{width:270px;height:270px}
.hero .t{text-align:center;color:var(--onb);display:flex;flex-direction:column;gap:6px}
.hero .t .lbl{color:var(--onb);opacity:.85}
.hero .t b{font-family:var(--mono);font-size:26px}
.facts{display:grid;grid-template-columns:repeat(2,250px);gap:18px 22px}
.fact{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:999px;padding:10px 26px 10px 10px}
.fact .val{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em}
.fact .w{width:70px;height:70px;flex:none}
.fact .w b{font-size:19px;font-weight:800;letter-spacing:-.02em}

/* 2 play */
.v-play{display:flex;flex-direction:column;align-items:center;gap:18px}
.live{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:999px;padding:12px 22px;font-size:17px;font-weight:600}
.live i{width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 var(--g);animation:beat 1.6s ease-out infinite}
@keyframes beat{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.graph text{font-family:var(--body);font-weight:800;font-size:22px}
.graph .edge{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.graph .spinbox{transform-box:fill-box;transform-origin:center}
.graph .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* 3 lock */
.v-lock{display:flex;align-items:center;gap:56px}
.yaml{background:var(--surface);border-radius:32px;padding:26px 30px;font-family:var(--mono);font-size:18px;line-height:2;width:470px}
.yaml .ln{display:block;padding:0 12px;border-radius:999px}
.yaml .key{color:var(--muted)}
.yaml .hl{background:linear-gradient(90deg,var(--bc) 50%,transparent 50%);background-size:200% 100%;background-position:100% 0;animation:sweep .8s var(--ease) forwards;animation-delay:calc(var(--d,0)*1ms)}
.yaml .hl .val{color:var(--b);font-weight:700}
:root .yaml .hl .val{color:var(--onbc)}
@keyframes sweep{to{background-position:0 0}}
.gate{display:flex;flex-direction:column;align-items:center;gap:16px}
.gate .layer{width:250px;height:250px}
.padlock{width:96px;height:96px;fill:none;stroke:var(--onb);stroke-width:7;stroke-linecap:round}
.padlock .sh{transition:transform .5s var(--spring);transform:translateY(-14px)}
.padlock.closed .sh{transform:none}
.gate b{font-size:23px;font-weight:800}
.gate span{color:var(--muted);font-size:16px}

/* 4 deploy, 5 publish */
.v-pipe{position:relative;width:900px}
.track{position:absolute;left:12.5%;right:12.5%;top:63px;height:16px;border-radius:999px;background:var(--line)}
.v-pipe.three .track{left:16.66%;right:16.66%}
.fill{height:100%;width:0;border-radius:999px;background:var(--b);transition:width .9s var(--spring)}
.nodes{position:relative;display:grid;grid-template-columns:repeat(4,1fr)}
.v-pipe.three .nodes{grid-template-columns:repeat(3,1fr)}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.st .layer{width:142px;height:142px;margin-bottom:8px}
.st b{font-size:21px;font-weight:800}
.st .sub{font-family:var(--mono);font-size:13.5px;color:var(--faint)}
.st .state{margin-top:6px;font-size:15px;font-weight:600;padding:5px 14px;border-radius:999px;background:var(--surface);color:var(--muted);transition:background .3s,color .3s}
.st.ok .state{background:var(--gc);color:var(--g)}
.st.run .state{background:var(--bc);color:var(--onbc)}
.st.fail .state{background:var(--rc);color:var(--r)}
:root .st.ok .state{color:var(--fg)}
.verdict{margin:30px auto 0;width:max-content;font-size:22px;font-weight:800;padding:14px 28px;border-radius:999px;background:var(--gc);color:var(--fg);display:flex;gap:12px;align-items:center}
.verdict.bad{background:var(--rc)}
.verdict[hidden]{display:none}
.chip{position:absolute;left:0;top:0;font-family:var(--mono);font-size:15px;font-weight:700;background:var(--y);color:var(--ony);padding:10px 18px;border-radius:999px;
  offset-path:path('M150 70 C 300 -110, 600 -110, 750 70');offset-rotate:0deg;offset-distance:0%;opacity:0;z-index:3}
.chip.fly{animation:fly 1.6s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fly{0%{opacity:0;offset-distance:0%;transform:scale(.6)}12%{opacity:1;transform:scale(1)}88%{opacity:1}100%{opacity:0;offset-distance:100%;transform:scale(.5)}}
.ripple{position:absolute;width:142px;height:142px;border-radius:50%;border:5px solid var(--b);opacity:0;pointer-events:none}
.ripple.go{animation:ripple 1.8s var(--ease) forwards}
@keyframes ripple{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}

/* 6, 8 score */
.v-score{display:flex;align-items:center;gap:60px}
.gauge{width:320px;height:320px}
.gauge svg.ring{transform:rotate(-90deg)}
.gauge .arc{transition:stroke-dashoffset 1.4s var(--spring),stroke .5s}
.gauge .num{text-align:center}
.gauge .num b{display:block;font-size:76px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.gauge .num span{font-family:var(--mono);font-size:14px;color:var(--muted)}
.sidecol{display:flex;flex-direction:column;gap:16px;max-width:400px}
.sidecol .big{font-size:38px;font-weight:900;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.sidecol .sm{color:var(--muted);font-size:18px;line-height:1.5}
.was{font-family:var(--mono);font-size:16px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .row{display:flex;align-items:center;gap:14px;padding:10px 22px 10px 10px;border-radius:999px;font-size:19px;font-weight:600;background:var(--surface)}
.cmp .row .layer{width:46px;height:46px}
.cmp .row .lbl{width:84px}

/* 7 diff */
.v-diff{display:flex;flex-direction:column;gap:20px;width:780px}
.drow{position:relative;font-family:var(--mono);font-size:22px;padding:18px 30px;border-radius:999px;display:flex;gap:20px;transition:transform .6s var(--spring),opacity .5s}
.drow.m{background:var(--rc);color:var(--fg)}
.drow.pl{background:var(--gc);color:var(--fg);transform:translateX(120px);opacity:0}
.drow.pl.in{transform:none;opacity:1}
.drow.m::after{content:"";position:absolute;left:70px;right:60px;top:50%;height:3px;border-radius:3px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.drow.m.out{opacity:.55;transform:translateX(-30px)}
.drow.m.out::after{transform:scaleX(1)}
.checks{display:flex;gap:20px;margin-top:10px}
.check{flex:1;display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:999px;padding:10px 26px 10px 10px;font-size:21px;font-weight:700;color:var(--faint);transition:color .3s}
.check.ok{color:var(--fg)}
.check .layer{width:58px;height:58px}

/* 9 install */
.v-install{position:relative;width:900px;height:430px;display:grid;place-items:center}
.v-install .core{display:flex;flex-direction:column;align-items:center;gap:22px;z-index:1}
.big-cmd{font-family:var(--mono);font-size:38px;font-weight:500;background:var(--cmd-bg);color:var(--cmd-fg);padding:28px 46px;border-radius:999px;box-shadow:0 0 0 10px var(--bc)}
.v-install .sm{font-size:21px;color:var(--muted);font-weight:600}
.recap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px}
.recap span{font-family:var(--mono);font-size:15px;font-weight:500;padding:8px 16px;border-radius:999px}
.float{position:absolute}

/* controls */
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1280px}
.ctl button{min-height:44px;min-width:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.ctl button.pri{background:var(--b);border-color:var(--b);color:var(--onb);font-weight:600}
.ctl .tog[aria-pressed="true"]{border-color:var(--r);color:var(--r)}
.ctl .help{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin-left:auto}
body.clean .ctl{display:none}
/* speaker notes */
.notes{width:100%;max-width:1280px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 24px 22px;display:flex;flex-direction:column;gap:14px}
.notes-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notes-head h2{margin:0;font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:500}
.notes-head .step{font-size:17px;font-weight:700;color:var(--fg)}
.notes ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:baseline}
.notes .who{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;text-align:center;padding:4px 0;border-radius:999px}
.notes .who.cam{background:var(--bc);color:var(--onbc)}
.notes .who.vo{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.notes .line{font-size:18px;line-height:1.5;color:var(--fg);max-width:75ch}
.notes .tip{font-size:14.5px;line-height:1.45;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.notes .tip b{color:var(--fg)}
body.clean .notes{display:none}
@media (max-width:600px){.notes li{grid-template-columns:52px minmax(0,1fr)}.notes .line{font-size:17px}}

body.clean{padding:0;background:var(--stage)}
@media (max-width:700px){.ctl .help{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .spin,.bob,.pulse,.live i{animation:none!important}
}

/* V3: picture-in-picture composition. Black 16:9 plate, static presenter frame left,
   the live V2 screen scaled into a framed panel right. */
:root{--pip:#000000;--frame-line:#4c8df6}
.stage{background:var(--pip)!important;border:0!important;display:block!important}
.stage .rail{display:none}
.presenter{position:absolute;left:30px;top:118px;width:290px;height:484px;border-radius:24px;border:3px solid var(--frame-line);overflow:hidden;background:#222}
.presenter img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;max-width:none}
.presenter .tag{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:999px}
.panel{position:absolute;left:344px;top:36px;width:906px;height:648px;border-radius:28px;border:3px solid var(--frame-line);overflow:hidden;background:var(--stage)}
.panel .main{width:1018px;height:720px;transform:scale(.8841);transform-origin:0 0}
.ctl .where{font-family:var(--mono);font-size:13px;color:var(--muted);padding:0 6px}
</style>

<div class="frame" id="frame">
  <div class="stage" id="stage">
    <aside class="rail">
      <div class="brand"><b>Agents CLI</b> · live build</div>

<script>
const NOTES=[{"l": [["CAM", "Let's build it. I'll use LangGraph, to make a point."], ["VO", "One command scaffolds a LangGraph project for Cloud Run, serving A2A. No ADK dependency anywhere."], ["VO", "Eighteen of the CLI's twenty-four commands don't care which framework you use. Extensions cover the rest. So LangChain, LangGraph and Deep Agents work today."]]}, {"l": [["VO", "And playground opens it locally, in LangGraph Studio. Same command, whatever the framework."]]}, {"l": [["CAM", "Now the part platform teams care about. Who decides what's allowed to ship?"], ["VO", "This adds the platform team's security gate to deploy. It's pinned to an exact commit in a lockfile, so nobody quietly changes the rules."], ["VO", "The same mechanism can enforce an SSO check or a model risk sign-off. You don't fork the CLI. You wrap it."]]}, {"l": [["VO", "Now every deploy runs a vulnerability scan first. If it fails, nothing ships."]], "tip": "<b>Optional:</b> press B before this step to show the scan blocking the deploy, then press B and R to replay it passing. Only use this if the real demo can stage a failing scan."}, {"l": [["VO", "Deploy to Cloud Run. Then one more command registers the agent with Gemini Enterprise."], ["VO", "And we're back where we started. Now you know how it got there."]], "tip": "<b>Edit note:</b> match-cut to the cold-open shot of the agent live in Gemini Enterprise."}, {"l": [["CAM", "Shipping once is easy. Staying good is the hard part. So let's break it."], ["VO", "First, a baseline. Four out of five."]]}, {"l": [["VO", "Now a small change. Swap the model."], ["VO", "Unit tests pass. The linter passes."]]}, {"l": [["VO", "The eval doesn't. Two point seven five."], ["VO", "Eval compare shows why. The agent stopped calling its tool."], ["CAM", "That's the line between a prototype and something you ship. And it's built into the workflow, so coding agents actually use it."]], "tip": "<b>Optional next:</b> the benchmark section follows here if legal clears it. It has no screen in this set yet."}, {"l": [["CAM", "So: your coding agent can build an agent. Agents CLI makes it one you can ship. Any framework, your rules, tested, and live in Gemini Enterprise."], ["CAM", "One line to install. Links are below. Go build something you can ship."]]}];
function renderNotes(){const n=NOTES[i]||{l:[]};
 $('nstep').textContent=`Step ${i+1} of ${S.length} · ${S[i].name}`;
 $('nlist').innerHTML=n.l.map(([w,t])=>`<li><span class="who ${w=='CAM'?'cam':'vo'}">${w}</span><span class="line">${t}</span></li>`).join('');
 const tp=$('ntip');if(n.tip){tp.innerHTML=n.tip;tp.hidden=false}else tp.hidden=true}

const S=[
 {phase:"Build",name:"Scaffold",cmd:"agents-cli create my-agent --agent google/agents-cli/extensions/langchain/template@v1.11.0 -d cloud_run",lesson:"One command scaffolds a working project, in the framework you choose.",v:"create"},
 {name:"Preview locally",cmd:"agents-cli playground",lesson:"Same command, whatever the framework. LangGraph opens in LangGraph Studio.",v:"play"},
 {phase:"Your rules",name:"Add a gate",cmd:"agents-cli extension add acme/platform-extensions#sbom-deploy --ref v1.0.0",lesson:"An extension is your policy, wrapped around a CLI command and pinned to a commit.",v:"lock"},
 {name:"Deploy",cmd:"agents-cli deploy",lesson:"Every deploy runs the scan first. If it fails, nothing ships.",v:"deploy"},
 {phase:"Ship",name:"Publish",cmd:"agents-cli publish gemini --agent-card-url https://<service-url>/a2a/app/.well-known/agent-card.json --gemini-app-id <app-id>",lesson:"One more command, and the whole company can call your agent.",v:"publish"},
 {phase:"Break it",name:"Baseline eval",cmd:"agents-cli eval grade",lesson:"Before you change anything, measure how the agent behaves today.",v:"base"},
 {name:"Swap the model",cmd:null,cmdNote:"A one-line change in the agent's config",lesson:"Tests check the code. They can't tell you the agent got worse.",v:"diff"},
 {name:"Eval catches it",cmd:"agents-cli eval grade && agents-cli eval compare",lesson:"Tests check the code. Evals check the behaviour.",v:"regress"},
 {phase:"Start",name:"Install",cmd:"uvx google-agents-cli setup",lesson:"Your coding agent can build an agent. Agents CLI makes it one you can ship.",v:"install"}
];
let i=0, blocked=false, timers=[];
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const later=(f,ms)=>timers.push(setTimeout(f,RM?0:ms));

/* ---------- Material shapes: every shape is 120 points, so any two can morph ---------- */
const N=120;
function pts(fn){let d='';for(let k=0;k<N;k++){const a=k/N*Math.PI*2,r=fn(a);d+=(k?'L':'M')+(50+r*Math.cos(a)).toFixed(2)+' '+(50+r*Math.sin(a)).toFixed(2)}return d+'Z'}
const SH={
 circle:pts(()=>46),
 cookie9:pts(a=>43+4*Math.cos(9*a)),
 cookie12:pts(a=>44+3*Math.cos(12*a)),
 clover4:pts(a=>40+8*Math.cos(4*a)),
 flower8:pts(a=>42+6*Math.cos(8*a)),
 sunny:pts(a=>40+8*Math.pow(Math.abs(Math.cos(6*a)),.6)*Math.sign(Math.cos(6*a))),
 spiky:pts(a=>36+11*Math.cos(10*a)),
 squircle:pts(a=>{const c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return 46/Math.pow(Math.pow(c,4)+Math.pow(s,4),.25)}),
 pill:pts(a=>{const c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return 46/Math.pow(Math.pow(c,3)+Math.pow(s*1.6,3),1/3)})
};
function shape(kind,fill,cls='',id=''){return `<svg class="shape ${cls}" ${id?`id="${id}"`:''} viewBox="0 0 100 100" width="100%" height="100%"><path d="${SH[kind]}" style="d:path('${SH[kind]}');fill:${fill}"/></svg>`}
function morph(id,kind,fill){const s=$(id);if(!s)return;const p=s.querySelector('path');p.style.d=`path('${SH[kind]}')`;p.setAttribute('d',SH[kind]);if(fill)p.style.fill=fill}
const TICK='<svg class="glyph" viewBox="0 0 24 24" style="stroke:CLR"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS='<svg class="glyph" viewBox="0 0 24 24" style="stroke:CLR"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const tick=c=>TICK.replace('CLR',c), cross=c=>CROSS.replace('CLR',c);

/* rail */
(function(){const ol=$('steps');S.forEach((s,n)=>{if(s.phase){const p=document.createElement('div');p.className='phase';p.textContent=s.phase;ol.appendChild(p)}
 const li=document.createElement('li');li.innerHTML=`<span class="dot"><span>${n+1}</span></span><span>${s.name}</span>`;li.onclick=()=>go(n);ol.appendChild(li)})})();

function type(text){
 const c=$('cmd'),t=$('cmdt');
 if(!text){c.classList.add('noc');c.querySelector('.p').textContent='✎';t.textContent=S[i].cmdNote;return}
 c.classList.remove('noc');c.querySelector('.p').textContent='$';
 if(RM){t.textContent=text;return}
 t.innerHTML='';let k=0;const step=Math.max(14,Math.min(34,1500/text.length));
 const f=()=>{t.innerHTML=text.slice(0,k).replace(/</g,'&lt;')+'<span class="caret"></span>';if(k++<text.length)timers.push(setTimeout(f,step))};f();
}
const T=()=>RM?0:Math.min(1600,(S[i].cmd||'').length*20)+250;

/* ---------- views ---------- */
const V={
 create:t=>`<div class="v-create">
   <div class="hero layer pop" style="--d:${t}">${shape('cookie9','var(--b)','spin','hs')}<div class="t"><span class="lbl">New project</span><b>my-agent/</b></div></div>
   <div class="facts">${[["Framework","LangGraph","clover4","var(--b)","var(--onb)"],["Runs on","Cloud Run","sunny","var(--y)","var(--ony)"],["Speaks","A2A","flower8","var(--r)","var(--onr)"],["ADK code","None","cookie12","var(--g)","var(--ong)"]]
     .map((f,n)=>`<div class="fact pop" style="--d:${t+350+n*200}"><div class="w layer">${shape(f[2],f[3],'spin')}<b style="color:${f[4]}">${['LG','CR','A2A','0'][n]}</b></div><div><span class="lbl">${f[0]}</span><span class="val">${f[1]}</span></div></div>`).join('')}</div></div>`,
 play:t=>`<div class="v-play"><div class="live pop" style="--d:${t}"><i></i>LangGraph Studio · running locally</div>
   <svg class="graph rise" style="--d:${t+150}" width="800" height="330" viewBox="0 0 800 330">
    <path class="edge" d="M140 165 H290"/><path class="edge" d="M440 120 C 500 30, 590 30, 640 95"/><path class="edge" d="M640 235 C 590 300, 500 300, 440 210"/>
    <g transform="translate(55 120) scale(.9)"><path d="${SH.circle}" fill="var(--line)"/></g><text x="100" y="172" text-anchor="middle" fill="var(--fg)" style="font-size:18px">start</text>
    <g class="pulse"><g transform="translate(275 75) scale(1.8)"><g class="spinbox spin"><path d="${SH.cookie9}" fill="var(--b)"/></g></g></g>
    <text x="365" y="173" text-anchor="middle" fill="var(--onb)">agent</text>
    <g transform="translate(600 95) scale(1.4)"><g class="spinbox spin"><path d="${SH.clover4}" fill="var(--y)"/></g></g>
    <text x="670" y="173" text-anchor="middle" fill="var(--ony)">tools</text>
    ${RM?'':`<circle r="13" fill="var(--g)" stroke="var(--stage)" stroke-width="4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M100 165 L365 165 C 470 10, 600 30, 670 165 C 600 300, 470 320, 365 165"/></circle>`}
   </svg></div>`,
 lock:t=>`<div class="v-lock"><div class="yaml rise" style="--d:${t}"><div class="lbl" style="margin:0 0 6px 12px">agents-cli-extensions.yaml</div>
   <span class="ln"><span class="key">- name:</span> sbom-deploy</span><span class="ln"><span class="key">  source:</span> acme/platform-extensions</span>
   <span class="ln"><span class="key">  ref:</span> v1.0.0</span><span class="ln hl" style="--d:${t+500}"><span class="key">  commit:</span> <span class="val">pinned SHA</span></span></div>
   <div class="gate"><div class="layer pop" style="--d:${t+250}">${shape('circle','var(--b)','spin','gs')}
     <svg class="padlock" id="pl" viewBox="0 0 48 48"><path class="sh" d="M15 22v-6a9 9 0 0 1 18 0v6"/><rect x="9" y="22" width="30" height="20" rx="6" fill="var(--onb)" stroke="none"/></svg></div>
     <b class="rise" style="--d:${t+1100}">Security gate added</b><span class="rise" style="--d:${t+1250}">Runs before every deploy</span></div></div>`,
 deploy:t=>pipe([['n1','SBOM','syft'],['n2','Vulnerability scan','grype'],['n3','Deploy','agents-cli'],['n4','Cloud Run','live service']],t),
 publish:t=>pipe([['p1','Cloud Run','live service'],['p2','Agent card','A2A'],['p3','Gemini Enterprise','company-wide']],t,true),
 base:t=>`<div class="v-score">${gauge(t,0,'cookie9','var(--gc)')}<div class="sidecol"><span class="lbl rise" style="--d:${t+900}">Baseline</span><span class="big rise" style="--d:${t+1000}">Four out of five.</span><span class="sm rise" style="--d:${t+1100}">Mean score across the eval cases, before any change.</span></div></div>`,
 diff:t=>`<div class="v-diff"><span class="lbl rise" style="--d:100;margin-left:30px">Agent config · model</span>
   <div class="drow m rise" id="dm" style="--d:200"><b>−</b>model: gemini-3.8-flash</div>
   <div class="drow pl" id="dp"><b>+</b>model: gemini-2.5-flash</div>
   <div class="checks"><div class="check rise" id="c1" style="--d:400"><div class="layer">${shape('circle','var(--line)','','c1s')}</div>Unit tests</div>
   <div class="check rise" id="c2" style="--d:500"><div class="layer">${shape('circle','var(--line)','','c2s')}</div>Linter</div></div></div>`,
 regress:t=>`<div class="v-score">${gauge(t,4,'cookie9','var(--gc)')}<div class="sidecol"><span class="was rise" style="--d:${t+700}">was 4.00</span><span class="big rise" style="--d:${t+800}">The eval catches it.</span>
   <div class="cmp"><span class="lbl rise" style="--d:${t+1500}">eval compare · what changed</span>
   <div class="row rise" style="--d:${t+1650}"><div class="layer">${shape('clover4','var(--g)')}${tick('var(--ong)')}</div><span class="lbl">Expected</span>Agent calls its tool</div>
   <div class="row rise" style="--d:${t+1850}"><div class="layer">${shape('spiky','var(--r)')}${cross('var(--onr)')}</div><span class="lbl">Got</span>No tool call</div></div></div></div>`,
 install:t=>{const fl=[['cookie9','var(--b)',110,40,30],['clover4','var(--y)',84,790,50],['flower8','var(--g)',96,70,300],['sunny','var(--r)',70,800,320],['squircle','var(--bc)',56,430,0]];
   return `<div class="v-install">${fl.map((f,n)=>`<div class="float pop" style="--d:${t+n*120};left:${f[3]}px;top:${f[4]}px;width:${f[2]}px;height:${f[2]}px"><div class="bob" style="width:100%;height:100%;animation-delay:-${n*0.8}s">${shape(f[0],f[1],'spin')}</div></div>`).join('')}
   <div class="core"><div class="big-cmd pop" style="--d:${t}">uvx google-agents-cli setup</div><div class="sm rise" style="--d:${t+300}">Links in the description</div>
   <div class="recap">${['create','playground','extension add','deploy','publish gemini','eval grade','eval compare'].map((x,n)=>{const c=[['--bc','--onbc'],['--yc','--fg'],['--gc','--fg'],['--rc','--fg']][n%4];return `<span class="pop" style="--d:${t+500+n*90};background:var(${c[0]});color:var(${c[1]})">${x}</span>`}).join('')}</div></div></div>`}
};
function pipe(nodes,t,three){return `<div class="v-pipe ${three?'three':''} rise" style="--d:${t}"><div class="track"><div class="fill" id="fill"></div></div>
  ${three?'<div class="chip" id="chip">agent-card.json</div>':''}
  <div class="nodes">${nodes.map(n=>`<div class="st" id="${n[0]}"><div class="layer">${shape('circle','var(--line)','',n[0]+'s')}<span class="ico"></span>${three&&n[0]=='p3'?'<span class="ripple" id="r1"></span><span class="ripple" id="r2"></span>':''}</div><b>${n[1]}</b><span class="sub">${n[2]}</span><span class="state">Waiting</span></div>`).join('')}</div>
  <div class="verdict" id="vd" hidden></div></div>`}
function setNode(id,state,txt,kind){const n=$(id);if(!n)return;n.className='st '+state;n.querySelector('.state').textContent=txt;
 const sv=$(id+'s'),ico=n.querySelector('.ico');
 if(state=='run'){morph(id+'s','cookie9','var(--b)');sv.classList.add('spin','fast');ico.innerHTML=''}
 if(state=='ok'){sv.classList.remove('spin','fast');morph(id+'s',kind||'clover4',id=='p3'?'var(--b)':'var(--g)');ico.innerHTML=tick(id=='p3'?'var(--onb)':'var(--ong)')}
 if(state=='fail'){sv.classList.remove('spin','fast');morph(id+'s','spiky','var(--r)');ico.innerHTML=cross('var(--onr)');n.querySelector('.layer').classList.add('shake')}
}
function gauge(t,from,blob,blobFill){const C=2*Math.PI*125;
 return `<div class="gauge layer pop" style="--d:${t}"><div style="width:215px;height:215px">${shape(blob,blobFill,'spin','gb')}</div>
  <svg class="ring" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="125" fill="none" stroke="var(--line)" stroke-width="30"/>
  <circle class="arc" id="arc" cx="160" cy="160" r="125" fill="none" stroke="var(--g)" stroke-width="30" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-from/5)}"/></svg>
  <div class="num"><b id="sc">${from.toFixed(2)}</b><span>out of 5.0</span></div></div>`}
function setGauge(v,col){const C=2*Math.PI*125,a=$('arc');a.style.strokeDashoffset=C*(1-v/5);a.style.stroke=col}
function countTo(a,b){const el=$('sc');if(!el)return;if(RM){el.textContent=b.toFixed(2);return}const t0=performance.now();
 const f=t=>{const p=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-p,3);el.textContent=(a+(b-a)*e).toFixed(2);if(p<1&&$('sc'))requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- timelines ---------- */
function run(t){
 const v=S[i].v, fill=w=>{const f=$('fill');if(f)f.style.width=w};
 if(v=='lock'){later(()=>morph('gs','cookie12'),t+550);later(()=>$('pl').classList.add('closed'),t+900)}
 if(v=='deploy'){
  later(()=>setNode('n1','run','Building'),t+300);
  later(()=>{setNode('n1','ok','Generated','clover4');fill('33.3%');setNode('n2','run','Scanning')},t+1300);
  later(()=>{if(blocked){setNode('n2','fail','Vulnerable package');verdict(false,'Deploy stopped by the platform gate');return}
   setNode('n2','ok','No known vulnerabilities','sunny');fill('66.6%');setNode('n3','run','Deploying')},t+2600);
  later(()=>{if(blocked)return;setNode('n3','ok','Done','flower8');fill('100%');setNode('n4','run','Starting')},t+3800);
  later(()=>{if(blocked)return;setNode('n4','ok','Live','cookie12');verdict(true,'Scanned, then shipped')},t+4600);
 }
 if(v=='publish'){
  later(()=>setNode('p1','ok','Live','cookie12'),t+300);
  later(()=>{fill('50%');setNode('p2','run','Serving card')},t+900);
  later(()=>{setNode('p2','ok','Served','squircle');const c=$('chip');c&&c.classList.add('fly');setNode('p3','run','Registering')},t+1700);
  later(()=>{fill('100%');setNode('p3','ok','Registered','sunny');$('r1')?.classList.add('go');later(()=>$('r2')?.classList.add('go'),350)},t+3300);
  later(()=>verdict(true,'Anyone in the company can call it'),t+3800);
 }
 if(v=='base'){later(()=>{setGauge(4,'var(--g)');countTo(0,4)},t+350);later(()=>morph('gb','flower8'),t+1400)}
 if(v=='diff'){
  later(()=>$('dm').classList.add('out'),800);later(()=>$('dp').classList.add('in'),1100);
  [['c1','Unit tests pass',1900],['c2','Linter passes',2400]].forEach(([id,txt,ms])=>later(()=>{const c=$(id);c.classList.add('ok');morph(id+'s',id=='c1'?'clover4':'cookie9','var(--g)');
    c.querySelector('.layer').insertAdjacentHTML('beforeend',tick('var(--ong)'));c.lastChild.textContent=txt},ms));
 }
 if(v=='regress'){later(()=>{setGauge(2.75,'var(--r)');countTo(4,2.75);morph('gb','spiky','var(--rc)');$('gb').parentElement.classList.add('shake')},t+450)}
}
function verdict(ok,txt){const d=$('vd');if(!d)return;d.hidden=false;d.className='verdict pop'+(ok?'':' bad');
 d.innerHTML=`<span class="layer" style="width:34px;height:34px">${shape(ok?'clover4':'spiky',ok?'var(--g)':'var(--r)')}${ok?tick('var(--ong)'):cross('var(--onr)')}</span>${txt}`}

function go(n){
 timers.forEach(clearTimeout);timers=[];
 i=Math.max(0,Math.min(S.length-1,n));const s=S[i];
 document.querySelectorAll('.steps li').forEach((li,k)=>li.className=k<i?'done':k==i?'on':'');
 const on=document.querySelector('.steps li.on');
 $('thread').style.height=(on.offsetTop+on.offsetHeight/2-14)+'px';
 const t=T();$('view').innerHTML=V[s.v](t);
 type(s.cmd);$('lv').textContent=s.lesson;
 $('prev').disabled=i==0;renderNotes();$('where').textContent=`Step ${i+1} of ${S.length} · ${s.name}`;$('next').textContent=i==S.length-1?'Back to start':'Next step →';
 run(t);
 try{history.replaceState(null,'','#step-'+(i+1))}catch(e){}
}
$('prev').onclick=()=>go(i-1);
$('next').onclick=()=>go(i==S.length-1?0:i+1);
function toggleGate(){blocked=!blocked;$('gate').setAttribute('aria-pressed',blocked);$('gate').textContent='Gate: '+(blocked?'block':'pass');if(S[i].v=='deploy')go(i)}
$('gate').onclick=toggleGate;
$('clean').onclick=()=>{document.body.classList.add('clean');fit()};
addEventListener('keydown',e=>{
 if(e.key=='ArrowRight'||e.key==' '){e.preventDefault();go(i+1)}
 else if(e.key=='ArrowLeft')go(i-1);
 else if(e.key=='b'||e.key=='B')toggleGate();
 else if(e.key=='r'||e.key=='R')go(i);
 else if(e.key=='h'||e.key=='H'){document.body.classList.toggle('clean');fit()}
});
function fit(){$('stage').style.transform=`scale(${$('frame').clientWidth/1280})`}
addEventListener('resize',fit);
const m=/^#step-(\d+)$/.exec(location.hash);
fit();go(m?+m[1]-1:0);
if(document.fonts)document.fonts.ready.then(()=>{fit();const on=document.querySelector('.steps li.on');if(on)$('thread').style.height=(on.offsetTop+on.offsetHeight/2-14)+'px'});
</script>

</body></html>
