<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#110f0d">
<title>Guetta Studios · Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>

/* Layout: one phone-width column — envelope header, a lit "thread" rail that walks the reader through the asks, then calm reference below. Single dark look by choice. */
:root{
  --bg:#110f0d; --surface:#1a1816; --raised:#221f1c; --line:#2e2a26;
  --fg:#efeae3; --muted:#b9b1a7; --faint:#8a8279;
  --glow:#f0b866; --glow-soft:rgba(240,184,102,.18); --glow-2:#ffd9a0;
  --ok:#8fd3ae; --ok-soft:rgba(143,211,174,.12);
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:8px}
.label{font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.proto{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.proto b{color:var(--fg);font-weight:500}

/* Header */
.head{display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 i{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(143,211,174,.35);background:var(--ok-soft)}

/* Phase strip: real milestones on one time scale */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.phase-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.phase-top strong{font-weight:500}
.track{position:relative;height:28px}
.track .bar{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line);border-radius:2px}
.track .fill{position:absolute;left:0;top:12px;height:2px;background:linear-gradient(90deg,var(--faint),var(--glow));border-radius:2px}
.track .tick{position:absolute;top:8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.track .tick.next{border-color:var(--glow);box-shadow:0 0 0 4px var(--glow-soft),0 0 14px var(--glow)}
.track .now{position:absolute;top:2px;width:2px;height:22px;margin-left:-1px;background:var(--fg);border-radius:2px}
.track-legend{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--faint)}

/* Hero line with wipe glow */
.lead{display:flex;flex-direction:column;gap:6px}
.wipe{font-family:var(--display);font-size:clamp(26px,7vw,32px);line-height:1.12;margin:0;font-weight:400;
  background:linear-gradient(100deg,var(--fg) 0%,var(--fg) 40%,var(--glow-2) 50%,var(--glow) 55%,var(--fg) 65%,var(--fg) 100%);
  background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:wipe 2.6s .4s cubic-bezier(.4,0,.2,1) 1 both}
@keyframes wipe{from{background-position:100% 0}to{background-position:0 0}}
.lead p{margin:0;color:var(--muted);font-size:17px}

/* Filter */
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;color:var(--muted)}
.filter button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}

/* Asks with thread rail */
.asks{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.rail{position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.rail-lit{position:absolute;left:6px;top:8px;width:2px;background:linear-gradient(var(--faint),var(--glow));border-radius:2px;transition:height .9s cubic-bezier(.4,0,.2,1)}
.rail-dot{position:absolute;left:2px;width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 5px var(--glow-soft),0 0 18px var(--glow);transition:top .9s cubic-bezier(.4,0,.2,1)}
.ask{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .5s,background .5s}
.ask.active{background:var(--raised);border-color:rgba(240,184,102,.55);box-shadow:0 0 0 1px rgba(240,184,102,.15),0 0 32px -6px rgba(240,184,102,.35)}
.ask.active::after{content:"";position:absolute;inset:-1px;border-radius:16px;pointer-events:none;border:1px solid var(--glow);opacity:0;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}
.ask-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.who{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--glow)}
.ask:not(.active) .who{color:var(--muted)}
.ask h3{margin:0;font-size:19px;font-weight:500;line-height:1.35;text-wrap:balance}
.ask .ctx{margin:0;color:var(--muted);font-size:16.5px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16.5px;text-align:left;min-height:48px;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--glow);background:var(--glow-soft);color:var(--fg)}
.opt small{display:block;color:var(--muted);font-size:15px;line-height:1.45;margin-top:3px}
.opt.wide{flex:1 1 100%}
.note-btn{background:none;border:none;color:var(--muted);font-size:15.5px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);align-self:flex-start}
.note{display:flex;flex-direction:column;gap:8px}
.note textarea{width:100%;min-height:88px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.note textarea:focus{border-color:var(--glow);outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 16px;font-size:16px}
.btn.primary{background:var(--glow);border-color:var(--glow);color:#1a1208;font-weight:600}
.default{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--glow);border:1px solid rgba(240,184,102,.35);border-radius:999px;padding:3px 9px;white-space:nowrap}
.ask:not(.active) .default{color:var(--muted);border-color:var(--line)}
.done-line{display:none;align-items:center;gap:10px;font-size:16px}
.done-line .check{width:20px;height:20px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:12px;flex:none}
.done-line .ans{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-line button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:14.5px;flex:none;padding:6px 0}
.ask.answered{padding-block:10px}
.ask.answered .body{display:none}
.ask.answered .done-line{display:flex}
.saved{font-size:14px;color:var(--ok);min-height:1em}

/* Sections */
section{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.news{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.news li{list-style:none;display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.news ul{margin:0;padding:0}
.news .when{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:3px}
.news p{margin:0;color:var(--muted);font-size:16.5px;line-height:1.5}
.news strong{color:var(--fg);font-weight:500}
.frame{aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--bg) 10px 20px);display:grid;place-items:center}
.frame span{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.frame .tc{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10px;color:var(--faint);background:none;border:none;padding:0}
.frame .safe{position:absolute;inset:8% 6%;border:1px dashed rgba(154,146,137,.25);border-radius:4px}

.next2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mile .d{font-family:var(--mono);font-size:13px;color:var(--glow)}
.mile:last-child .d{color:var(--muted)}
.mile .t{font-size:16.5px;font-weight:500}
.mile .c{font-size:14.5px;color:var(--muted);line-height:1.45}

details{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details+details{margin-top:-4px}
summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:500}
summary::-webkit-details-marker{display:none}
summary .s{color:var(--muted);font-size:14px;font-weight:400;font-family:var(--mono)}
summary::after{content:"+";color:var(--muted);font-family:var(--mono);margin-left:4px}
details[open] summary::after{content:"–"}
.dbody{padding:0 16px 16px;color:var(--muted);font-size:16px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.dbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){color:var(--fg);text-align:right;font-family:var(--mono);font-size:14.5px}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;color:var(--fg)}
.budgetbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.budgetbar i{display:block;height:100%}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:grid;grid-template-columns:108px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.tl div:last-child{border-bottom:none}
.tl b{font-family:var(--mono);font-weight:400;font-size:13.5px;color:var(--fg)}
.tl .past b{color:var(--faint)}

.foot{color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.foot code{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Sticky progress dock */
.dock{position:fixed;left:0;right:0;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.dock-in{max-width:560px;margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.dock .prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dock .ptxt{font-size:15px}
.dock .ptxt span{color:var(--muted)}
.pbar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--glow);transition:width .6s}
.dock .btn.primary[disabled]{background:var(--bg);color:var(--faint);border-color:var(--line);cursor:default;font-weight:500}
.dock.sent .btn.primary{background:var(--ok-soft);border-color:rgba(143,211,174,.4);color:var(--ok)}

@media (prefers-reduced-motion:reduce){
  .wipe{animation:none;background:none;color:var(--fg)}
  .ask.active::after{animation:none;opacity:.4}
  .rail-dot,.rail-lit,.pbar i{transition:none}
}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
.state{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 0}
.state h1{font-size:30px;margin-bottom:10px;color:var(--fg)}
.state p{max-width:34ch;margin:0 auto}
.loader{width:120px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:18px auto 0}
.loader i{display:block;width:40%;height:100%;background:var(--glow);animation:load 1.2s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.offline{font-size:12px;color:var(--glow)}
.hi{font-size:14px;color:var(--muted)}
.xlink{color:var(--glow);text-decoration:none;border-bottom:1px solid rgba(240,184,102,.35);white-space:nowrap}
.xlink:hover{border-bottom-color:var(--glow)}
.askl{align-self:flex-start;font-size:16px;padding:4px 0}
.still{display:block;position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin:2px 0 4px;text-decoration:none}
.still img{display:block;width:100%;height:100%;object-fit:cover}
.still .tc{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:12px;color:#fff;background:rgba(0,0,0,.62);padding:3px 8px;border-radius:6px}
.still .go{position:absolute;right:8px;bottom:8px;font-size:12.5px;color:#fff;background:rgba(0,0,0,.62);padding:3px 8px;border-radius:6px}
.still.empty{display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--bg) 10px 20px)}
.still.empty span.ph{font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state" id="loading"><div><div class="brand">Guetta Studios</div><div class="loader"><i></i></div></div></div>
</div>
<div class="dock" id="dock" hidden><div class="dock-in">
  <div class="prog"><div class="ptxt" id="ptxt"></div><div class="pbar"><i id="pfill"></i></div></div>
  <button type="button" class="btn primary" id="sendBtn" disabled>Send to Guetta</button>
</div></div>

<script>
/* ===== Settings: paste the web app URL from Apps Script here ===== */
const API = "https://script.google.com/macros/s/AKfycbyTqRFA3_eMFQFrRrvRX0jJw2ThdYy6WepBNyrFi31et84ITqBVtByCyAjyi-QtdPsCzw/exec";
/* ================================================================= */

const params = new URLSearchParams(location.search);
const TOKEN = params.get("d") || "";
const DEMO = params.has("demo");
const QKEY = "gs-digest-queue-" + TOKEN.slice(0, 8);

let D = null, RECIPIENT = "", state = { answers:{}, filter:"mine", sent:false, openNote:null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* still frame for an ask: {src (data URI or https), tc, caption, href} */
const stillHtml = st => {
  if (!st || !st.tc) return "";
  const safeSrc = st.src && /^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/.test(st.src) ? st.src : "";
  const inner = safeSrc
    ? `<img src="${esc(safeSrc)}" alt="${esc(st.caption || ("Frame at " + st.tc))}" loading="lazy">`
    : `<span class="ph">Frame at ${esc(st.tc)}</span>`;
  const tag = st.href ? `a href="${esc(st.href)}" target="_blank" rel="noopener"` : "div";
  return `<${tag} class="still${safeSrc ? "" : " empty"}">${inner}<span class="tc">${esc(st.tc)}</span>${st.href ? `<span class="go">Open in Frame.io ↗</span>` : ""}</${st.href ? "a" : "div"}>`;
};
const money = v => "$" + Number(v).toLocaleString("en-US");

/* ---------- data ---------- */
async function load(){
  if (DEMO) {
    const r = await fetch("demo.json", {cache:"no-store"});
    if (!r.ok) throw new Error("No demo file");
    return { ok:true, recipient: params.get("as") || "Nick", digest: await r.json(), answers:{}, submitted:false };
  }
  if (!TOKEN) return { ok:false, error:"This page needs the private link from your email." };
  const r = await fetch(API + "?d=" + encodeURIComponent(TOKEN), {cache:"no-store"});
  return r.json();
}

function queue(){ try{ return JSON.parse(localStorage.getItem(QKEY) || "[]"); }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){} }
async function post(payload){
  if (DEMO) return true;
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ d: TOKEN }, payload)) });
    const j = await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
async function send(payload){
  const ok = await post(payload);
  if (!ok) { const q = queue().filter(x => !(x.action==="answer" && x.qid===payload.qid)); q.push(payload); setQueue(q); }
  return ok;
}
async function flushQueue(){
  const q = queue(); if (!q.length) return;
  const left = [];
  for (const p of q) if (!(await post(p))) left.push(p);
  setQueue(left);
  if (!left.length) flash("Saved");
}
window.addEventListener("online", flushQueue);

/* ---------- render ---------- */
let savedTimer;
function flash(msg, warn){ const el=$("#saved"); if(!el) return; el.textContent=msg; el.classList.toggle("offline",!!warn); clearTimeout(savedTimer); savedTimer=setTimeout(()=>el.textContent="",3000); }
function mine(a){ return a.who.split(/\s*&\s*|,\s*/).includes(RECIPIENT) || a.who === "Everyone"; }
function myAsks(){ const m = D.asks.filter(mine); return m.length ? m : D.asks; }
function visibleAsks(){ return state.filter==="mine" ? myAsks() : D.asks; }
function answerLabel(a){
  const ans = state.answers[a.id]; if(!ans) return "";
  let t = ans.value || "";
  if (a.kind==="choice"){ const o=a.options.find(o=>o.v===ans.value); if(o) t=o.t; }
  if (ans.note) t = t ? t+" · "+ans.note : ans.note;
  return t;
}
function countdown(){
  const ms = new Date(D.deadline) - Date.now();
  if (ms <= 0) return null;
  const h = Math.floor(ms/36e5), d = Math.floor(h/24);
  return d>=1 ? `${d}d ${h%24}h` : `${h}h ${Math.floor(ms%36e5/6e4)}m`;
}

function renderShell(){
  const p = D.phase;
  $("#app").innerHTML = `
  <header class="head">
    <div class="brandrow"><span class="brand">Guetta Studios</span><span class="label">${esc(D.issue)}</span></div>
    <h1>${esc(D.project).replace(/ Case Film$/,"<br><i>Case Film</i>")}</h1>
    <div class="meta">
      <span class="chip ok">${esc(D.status)}</span>
      ${D.subtitle?`<span class="chip">${esc(D.subtitle)}</span>`:""}
      <span class="chip">For ${esc(RECIPIENT)}</span>
    </div>
  </header>
  <div class="phase" aria-label="Project timeline">
    <div class="phase-top"><strong>Next: ${esc(p.nextLabel)}</strong><span class="label" id="nextIn"></span></div>
    <div class="track" id="track"><div class="bar"></div><div class="fill" id="fill"></div></div>
    <div class="track-legend">${p.legend.map(l=>`<span>${esc(l)}</span>`).join("")}</div>
  </div>
  <div class="lead"><p class="wipe" id="leadLine"></p><p id="leadSub"></p></div>
  <section aria-labelledby="h-asks">
    <div class="row" style="justify-content:space-between">
      <span class="label" id="h-asks">Needs you</span>
      <div class="filter" role="group" aria-label="Show asks">
        <button type="button" data-f="mine" aria-pressed="true">For you</button>
        <button type="button" data-f="all" aria-pressed="false">Everyone's</button>
      </div>
    </div>
    <div class="asks" id="asks"><div class="rail"></div><div class="rail-lit" id="railLit"></div><div class="rail-dot" id="railDot"></div></div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </section>
  <section aria-labelledby="h-new">
    <h2 id="h-new">What's new</h2>
    ${D.frame?`<div class="frame"><div class="safe"></div><span>${esc(D.frame.caption)}</span><span class="tc">${esc(D.frame.spec)}</span></div>`:""}
    <div class="news"><ul>${D.news.map(n=>`<li><span class="when">${esc(n.when)}</span><p><strong>${esc(n.head)}</strong> ${esc(n.body)}${n.link?` <a class="xlink" href="${esc(n.link.href)}" target="_blank" rel="noopener">${esc(n.link.label)} ↗</a>`:""}</p></li>`).join("")}</ul></div>
  </section>
  <section aria-labelledby="h-next">
    <h2 id="h-next">Coming up</h2>
    <div class="next2">${D.next.map(m=>`<div class="mile"><span class="d">${esc(m.d)}</span><span class="t">${esc(m.t)}</span><span class="c">${esc(m.c)}</span></div>`).join("")}</div>
  </section>
  <section aria-labelledby="h-rec">
    <h2 id="h-rec">The full record</h2>
    ${D.recordIntro?`<p style="margin:0;color:var(--muted);font-size:14px">${esc(D.recordIntro)}</p>`:""}
    ${D.record.map(renderRecord).join("")}
  </section>
  <footer class="foot">${D.footer.map(f=>`<span>${esc(f)}</span>`).join("")}</footer>`;
  drawPhase();
  document.querySelectorAll(".filter button").forEach(b=>b.addEventListener("click",()=>{
    state.filter=b.dataset.f; document.querySelectorAll(".filter button").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderAsks();
  }));
  $("#asks").addEventListener("click", onAskClick);
  $("#dock").hidden = false;
}

function renderRecord(s){
  let body = "";
  if (s.items) body = `<ul>${s.items.map(i=>`<li>${typeof i==="object"&&i.href?`<a class="xlink" href="${esc(i.href)}" target="_blank" rel="noopener">${esc(i.t)} ↗</a>`:esc(i)}</li>`).join("")}</ul>`;
  if (s.groups) body = s.groups.map(([g,items])=>`<span class="label">${esc(g)}</span><ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("");
  if (s.kv) body = `<div class="kv">${s.kv.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div>`;
  if (s.budget){
    const shades=["var(--glow)","var(--glow-2)","var(--muted)","var(--faint)"], total=s.budget.reduce((t,[,v])=>t+v,0);
    body = `<div class="budgetbar">${s.budget.map(([,v],i)=>`<i style="flex:${v};background:${shades[i%4]}"></i>`).join("")}</div>
      <div class="kv">${s.budget.map(([k,v],i)=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${shades[i%4]};margin-right:8px"></span>${esc(k)}</span><span>${money(v)}</span>`).join("")}<span class="tot">Total</span><span class="tot">${money(total)}</span></div>`;
  }
  if (s.timeline){
    const now = new Date();
    body = `<div class="tl">${s.timeline.map(([d,t,iso])=>`<div class="${new Date(iso)<now?"past":""}"><b>${esc(d)}</b><span>${esc(t)}</span></div>`).join("")}</div>`;
  }
  if (s.note) body += `<p style="margin:0;font-size:12px;color:var(--faint)">${esc(s.note)}</p>`;
  return `<details><summary>${esc(s.title)} ${s.tag?`<span class="s">${esc(s.tag)}</span>`:""}</summary><div class="dbody">${body}</div></details>`;
}

function drawPhase(){
  const p = D.phase, start=new Date(p.start), end=new Date(p.end), span=end-start, now=new Date();
  const pos = d => Math.min(100, Math.max(0, (new Date(d)-start)/span*100));
  const tlSec = D.record.find(s=>s.timeline), track=$("#track");
  let nextFound=false;
  (tlSec?tlSec.timeline:[]).forEach(([lab,,iso])=>{
    const i=document.createElement("div"); i.className="tick"; i.title=lab; i.style.left=pos(iso)+"%";
    if(!nextFound && new Date(iso)>now){ nextFound=true; i.classList.add("next"); }
    track.appendChild(i);
  });
  const np = pos(now); $("#fill").style.width = np+"%";
  const n=document.createElement("div"); n.className="now"; n.title="Today"; n.style.left=np+"%"; track.appendChild(n);
  const days = Math.ceil((new Date(p.nextDate)-now)/864e5);
  $("#nextIn").textContent = new Date(p.nextDate).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}) + (days>0?` · in ${days} day${days>1?"s":""}`:"");
}

function renderAsks(){
  const box=$("#asks"); box.querySelectorAll(".ask").forEach(n=>n.remove());
  const list = visibleAsks();
  const activeId = (list.find(a=>!state.answers[a.id])||{}).id;
  const cd = countdown();
  list.forEach(a=>{
    const ans = state.answers[a.id];
    const card = document.createElement("article");
    card.className = "ask"+(ans?" answered":"")+(a.id===activeId?" active":"");
    card.dataset.id = a.id;
    let opts = "";
    if (a.kind==="choice") opts = `<div class="opts">${a.options.map(o=>`<button type="button" class="opt${o.s?" wide":""}" data-v="${esc(o.v)}" aria-pressed="${!!(ans&&ans.value===o.v)}">${esc(o.t)}${o.s?`<small>${esc(o.s)}</small>`:""}</button>`).join("")}</div>`;
    if (a.kind==="forward") opts = `<div class="opts">${a.copyText&&D.copy&&D.copy[a.copyText]?`<button type="button" class="opt" data-copy="${esc(a.copyText)}">Copy deal points</button>`:""}${a.options.map(o=>`<button type="button" class="opt" data-v="${esc(o)}" aria-pressed="${!!(ans&&ans.value===o)}">${esc(o)}</button>`).join("")}</div>`;
    const showNote = a.kind==="note" || state.openNote===a.id;
    const note = showNote
      ? `<div class="note"><label class="label" for="n-${a.id}">${a.kind==="note"?"Your answer":"Add a note"}</label><textarea id="n-${a.id}" maxlength="2000" placeholder="${esc(a.placeholder||"Optional")}">${esc(ans&&ans.note||"")}</textarea><div class="row"><button type="button" class="btn primary" data-savenote="1">Save answer</button>${a.kind==="note"?`<button type="button" class="btn" data-v="Skip for now">Skip for now</button>`:""}</div></div>`
      : `<button type="button" class="note-btn" data-addnote="1">Add a note</button>`;
    const def = a.defaultLabel ? `<span class="default" title="If we don't hear back by then">${cd?`${esc(a.defaultLabel)} in <span data-cd>${cd}</span>`:esc(a.defaultLabel)}</span>` : "";
    card.innerHTML = `
      <div class="ask-top"><span class="who">For ${esc(a.who)}</span>${def}</div>
      <div class="body"><h3>${esc(a.title)}</h3>${a.ctx?`<p class="ctx">${esc(a.ctx)}</p>`:""}${stillHtml(a.still)}${a.link?`<a class="xlink askl" href="${esc(a.link.href)}" target="_blank" rel="noopener">${esc(a.link.label)} ↗</a>`:""}${opts}${note}</div>
      <div class="done-line"><span class="check">✓</span><span class="ans"><b style="font-weight:500">${esc(a.title.split(/[?,:]/)[0])}</b> — ${esc(answerLabel(a))}</span><button type="button" data-change="1">Change</button></div>`;
    box.appendChild(card);
  });
  requestAnimationFrame(moveRail);
  renderDock();
  const remaining = list.filter(a=>!state.answers[a.id]).length, lead=$("#leadLine");
  const first = RECIPIENT ? RECIPIENT + ", " : "";
  const txt = remaining===0 ? `All answered. Thank you${RECIPIENT?", "+RECIPIENT:""}.`
    : remaining===list.length ? (state.filter==="mine" ? `${first}${remaining===1?"one thing needs":(first?numWord(remaining).toLowerCase():numWord(remaining))+" things need"} you this week.` : D.lead)
    : (remaining<=2 ? `${numWord(remaining)} left. You're nearly through.` : `${numWord(remaining)} to go.`);
  if (lead.textContent!==txt){ lead.textContent=txt; lead.style.animation="none"; lead.offsetHeight; lead.style.animation=""; }
  $("#leadSub").textContent = remaining===0 ? "Tap Send to Guetta below, or change any answer first." : D.leadSub;
}
function numWord(n){ return ["zero","one","two","three","four","five","six","seven","eight","nine","ten"][n] ? (["zero","one","two","three","four","five","six","seven","eight","nine","ten"][n]).replace(/^./,c=>c.toUpperCase()) : String(n); }

function moveRail(){
  const box=$("#asks"), active=box.querySelector(".ask.active"), dot=$("#railDot"), lit=$("#railLit");
  if (!active){
    const last=box.querySelector(".ask:last-of-type"); const y = last ? last.offsetTop+last.offsetHeight-14 : 0;
    lit.style.height=Math.max(0,y-8)+"px"; dot.style.top=y+"px"; dot.style.background="var(--ok)"; dot.style.boxShadow="0 0 0 5px var(--ok-soft)"; return;
  }
  dot.style.background=""; dot.style.boxShadow="";
  const y = active.offsetTop+20; lit.style.height=Math.max(0,y-8)+"px"; dot.style.top=(y-5)+"px";
}

function renderDock(){
  const list = myAsks(), n=list.length, done=list.filter(a=>state.answers[a.id]).length;
  $("#ptxt").innerHTML = `${done} of ${n} <span>answered</span>`;
  $("#pfill").style.width = (n?done/n*100:0)+"%";
  const b=$("#sendBtn"); $("#dock").classList.toggle("sent", state.sent);
  if (state.sent){ b.textContent="Sent ✓"; b.disabled=false; }
  else { b.textContent = done===n ? "Send to Guetta" : (done ? "Send what I have" : "Send to Guetta"); b.disabled = done===0; }
}

async function answer(id, value, note){
  const prev = state.answers[id] || {};
  const next = { value: value!==undefined ? value : (prev.value||""), note: note!==undefined ? note : (prev.note||"") };
  if (!next.value && !next.note) delete state.answers[id]; else state.answers[id] = next;
  state.openNote=null; state.sent=false; renderAsks();
  const ok = await send({ action:"answer", qid:id, value:next.value, note:next.note });
  flash(ok ? "Saved" : "Saved on this phone. We'll send it when you're back online.", !ok);
}

async function onAskClick(e){
  const card=e.target.closest(".ask"), t=e.target.closest("button"); if(!card||!t) return;
  const id=card.dataset.id, a=D.asks.find(x=>x.id===id);
  if (t.dataset.copy){
    const text = D.copy[t.dataset.copy];
    try{ await navigator.clipboard.writeText(text); t.textContent="Copied. Paste it into your email to Tom"; }
    catch(err){ const ta=document.createElement("textarea"); ta.value=text; ta.readOnly=true; ta.style.cssText="width:100%;min-height:140px"; t.parentNode.after(ta); ta.select(); t.textContent="Select and copy the text below"; }
    return;
  }
  if (t.dataset.change){ return answer(id, "", ""); }
  if (t.dataset.addnote){ state.openNote=id; renderAsks(); const ta=document.getElementById("n-"+id); ta&&ta.focus(); return; }
  if (t.dataset.savenote){ const v=document.getElementById("n-"+id).value.trim(); return answer(id, a.kind==="note" ? "" : undefined, v); }
  if (t.dataset.v!==undefined) return answer(id, t.dataset.v);
}

$("#sendBtn").addEventListener("click", async ()=>{
  if (state.sent) return;
  state.sent=true; renderDock();
  const ok = await send({ action:"submit" });
  flash(ok ? "Sent. Andrea and Rafa will see your answers." : "Saved on this phone. We'll send it when you're back online.", !ok);
});

function fail(msg){
  $("#app").innerHTML = `<div class="state"><div><div class="brand">Guetta Studios</div><h1>This link isn't working</h1><p>${esc(msg)}</p></div></div>`;
}

(async ()=>{
  try{
    const res = await load();
    if (!res.ok) return fail(res.error || "Reply to the email and we'll resend it.");
    D = res.digest; RECIPIENT = res.recipient || ""; state.answers = res.answers || {}; state.sent = !!res.submitted;
    document.title = `${D.project} · Guetta Studios`;
    renderShell(); renderAsks();
    setInterval(()=>{ const c=countdown(); document.querySelectorAll("[data-cd]").forEach(el=>el.textContent=c||"now"); }, 30000);
    window.addEventListener("resize", ()=>requestAnimationFrame(moveRail));
    flushQueue();
  }catch(e){ fail("We couldn't load your digest. Check your connection and try again."); }
})();
</script>
</body>
</html>
